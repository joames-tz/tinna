<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Christina ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05010d}
  body{
    font-family:'Quicksand',system-ui,-apple-system,sans-serif;
    color:#fff;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- BACKGROUND ---------- */
  .aurora{
    position:fixed;inset:-30%;
    pointer-events:none;
    filter:blur(80px) saturate(135%);
    opacity:.45;
    transition:opacity 3s ease;
    will-change:transform,opacity;
  }
  #a1{
    background:
      radial-gradient(circle at 28% 32%, rgba(255,105,180,.55), transparent 55%),
      radial-gradient(circle at 72% 26%, rgba(140,90,255,.50), transparent 55%),
      radial-gradient(circle at 50% 80%, rgba(70,200,255,.42), transparent 58%);
    animation:swirl1 28s ease-in-out infinite alternate;
  }
  #a2{
    background:
      radial-gradient(circle at 65% 70%, rgba(255,175,95,.30), transparent 55%),
      radial-gradient(circle at 20% 75%, rgba(120,255,210,.26), transparent 55%);
    opacity:.55;
    animation:swirl2 34s ease-in-out infinite alternate;
  }
  body.connected .aurora{opacity:.95}
  @keyframes swirl1{
    0%{transform:scale(1) rotate(0deg) translate(0,0)}
    100%{transform:scale(1.28) rotate(18deg) translate(4%,-3%)}
  }
  @keyframes swirl2{
    0%{transform:scale(1.1) rotate(0deg) translate(0,0)}
    100%{transform:scale(1.35) rotate(-22deg) translate(-5%,4%)}
  }

  #stars{position:fixed;inset:0;pointer-events:none;z-index:1}

  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(circle at 50% 50%, transparent 35%, rgba(3,0,10,.82) 100%);
  }

  /* ---------- HERO ---------- */
  .hero{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.6rem;text-align:center;padding:2rem;
    transition:opacity 1.3s ease, transform 1.6s cubic-bezier(.2,.75,.2,1), filter 1.3s ease;
  }
  .hero.hidden{
    opacity:0;transform:scale(1.18);filter:blur(14px);pointer-events:none;
  }

  .eyebrow{
    font-size:clamp(.7rem,2.6vw,.85rem);
    letter-spacing:.55em;text-transform:uppercase;
    color:rgba(255,255,255,.55);
    text-indent:.55em;
    animation:fadeUp 1.6s ease both;
  }

  .name{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:300;
    font-size:clamp(3.2rem,15vw,8.5rem);
    line-height:.95;
    letter-spacing:.04em;
    background:linear-gradient(100deg,#ffffff,#ffd6ec,#d9ccff,#bfe9ff,#ffffff);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    animation:shimmer 9s linear infinite, fadeUp 1.8s .15s ease both;
    filter:drop-shadow(0 0 34px rgba(255,165,215,.45));
  }
  @keyframes shimmer{
    0%{background-position:0% 50%}
    100%{background-position:300% 50%}
  }

  .subtitle{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-style:italic;
    font-size:clamp(1rem,3.6vw,1.4rem);
    color:rgba(255,255,255,.72);
    margin-top:.3rem;
    animation:fadeUp 1.8s .35s ease both;
  }

  #connect{
    position:relative;
    margin-top:2.2rem;
    padding:1.05rem 3rem;
    font-family:inherit;
    font-size:.95rem;
    font-weight:500;
    letter-spacing:.32em;
    text-indent:.32em;
    text-transform:uppercase;
    color:#fff;
    background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.4);
    border-radius:999px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    cursor:pointer;
    transition:transform .45s cubic-bezier(.2,.75,.2,1), box-shadow .45s ease,
               border-color .45s ease, background .45s ease;
    animation:fadeUp 1.8s .55s ease both;
    box-shadow:0 0 30px rgba(255,150,210,.18);
  }
  #connect:hover,#connect:focus-visible{
    outline:none;
    transform:translateY(-3px) scale(1.05);
    border-color:rgba(255,255,255,.95);
    background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.10));
    box-shadow:0 0 45px rgba(255,140,205,.65), 0 0 110px rgba(150,120,255,.45);
  }
  #connect:active{transform:translateY(-1px) scale(.99)}
  #connect::after{
    content:'';position:absolute;inset:-2px;border-radius:999px;
    border:1px solid rgba(255,255,255,.55);
    animation:pulseRing 2.8s ease-out infinite;
    pointer-events:none;
  }
  @keyframes pulseRing{
    0%{transform:scale(1);opacity:.75}
    70%{transform:scale(1.45);opacity:0}
    100%{transform:scale(1.45);opacity:0}
  }

  .hint{
    margin-top:1.4rem;
    font-size:.72rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:rgba(255,255,255,.35);
    animation:fadeUp 1.8s .8s ease both, breathe 3.6s 2.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.75}}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ---------- TOP LABEL ---------- */
  .topname{
    position:fixed;top:5vh;left:50%;transform:translateX(-50%);
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(.75rem,3vw,1.05rem);
    letter-spacing:.6em;text-indent:.6em;text-transform:uppercase;
    color:rgba(255,255,255,.8);
    opacity:0;transition:opacity 2.4s ease 1.2s;
    pointer-events:none;z-index:6;white-space:nowrap;
    filter:drop-shadow(0 0 18px rgba(255,180,225,.8));
  }
  body.connected .topname{opacity:1}

  /* ---------- FLOATING WORDS ---------- */
  #words{
    position:fixed;inset:0;overflow:hidden;
    pointer-events:none;z-index:5;
  }
  .word{
    position:absolute;
    bottom:-16vh;
    white-space:nowrap;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:300;
    letter-spacing:.02em;
    opacity:0;
    will-change:transform,opacity,filter;
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
    text-shadow:0 0 22px currentColor, 0 0 60px currentColor;
    transform:translate3d(0,0,0);
  }
  @keyframes floatUp{
    0%{
      transform:translate3d(0,0,0) scale(.72) rotate(var(--rot,0deg));
      opacity:0;filter:blur(8px);
    }
    14%{opacity:var(--op,.85);filter:blur(0)}
    82%{opacity:var(--op,.85)}
    100%{
      transform:translate3d(var(--dx,0px),-132vh,0) scale(1.25) rotate(var(--rot,0deg));
      opacity:0;filter:blur(5px);
    }
  }

  /* ---------- RIPPLE ---------- */
  .ripple{
    position:fixed;left:50%;top:50%;
    width:24px;height:24px;margin:-12px 0 0 -12px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.85);
    pointer-events:none;z-index:20;
    animation:rippleOut 1.8s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rippleOut{
    0%{transform:scale(1);opacity:.95}
    100%{transform:scale(70);opacity:0}
  }

  @media (prefers-reduced-motion: reduce){
    .aurora{animation:none}
    .name{animation:shimmer 9s linear infinite}
  }
</style>
</head>
<body>

  <div class="aurora" id="a1"></div>
  <div class="aurora" id="a2"></div>
  <canvas id="stars"></canvas>
  <div class="vignette"></div>

  <div id="words"></div>
  <div class="topname">Christina</div>

  <div class="hero" id="hero">
    <p class="eyebrow">A little something for</p>
    <h1 class="name">Christina</h1>
    <p class="subtitle">because you deserve to be told</p>
    <button id="connect">Connect</button>
    <p class="hint">tap to begin</p>
  </div>

<script>
/* =========================================================
   1. CONFIG
   ========================================================= */
/*  Want a real song instead of the generated melody?
    Drop an mp3 next to this file and put its name here,
    e.g.  const SONG_URL = "christina.mp3";
    Leave it empty to use the built-in gentle melody.        */
const SONG_URL = "christina.mp3";

/*  Words that will flow across the screen.
    Add / remove / change however you like.                 */
const WORDS = [
  "Beautiful", "Loyal", "Amazing", "Kind", "Radiant",
  "Strong", "Genuine", "Warm-hearted", "Brilliant",
  "Thoughtful", "Graceful", "Brave", "Golden",
  "Inspiring", "Wonderful", "Sweet", "Honest",
  "Fearless", "Precious", "Lovely", "Unforgettable",
  "Sunshine", "Pure Magic", "One of a Kind",
  "Effortless", "Shining", "Irreplaceable", "Enough"
];

const COLORS = [
  "#ffd1e8", "#ffe6a7", "#bfe9ff", "#d9c9ff",
  "#ffc2c2", "#b8ffe6", "#ffffff", "#ffd9b3"
];

/* =========================================================
   2. STAR / PARTICLE FIELD
   ========================================================= */
const cv = document.getElementById("stars");
const g2 = cv.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const HUES = [335, 285, 200, 45, 160];
let W = 0, H = 0, parts = [], sprites = [];

function makeSprite(hue){
  const s = document.createElement("canvas");
  const size = 64;
  s.width = s.height = size;
  const c = s.getContext("2d");
  const gr = c.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  gr.addColorStop(0,    `hsla(${hue},100%,90%,1)`);
  gr.addColorStop(0.35, `hsla(${hue},100%,80%,0.35)`);
  gr.addColorStop(1,    `hsla(${hue},100%,80%,0)`);
  c.fillStyle = gr;
  c.fillRect(0, 0, size, size);
  return s;
}
sprites = HUES.map(makeSprite);

function sizeCanvas(){
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width  = W + "px";
  cv.style.height = H + "px";
  g2.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function initParts(){
  const count = Math.round(Math.min(150, Math.max(45, (W * H) / 12000)));
  parts = [];
  for (let i = 0; i < count; i++){
    parts.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.6 + 0.45,
      vy: -(0.10 + Math.random() * 0.35),
      vx: (Math.random() - 0.5) * 0.16,
      a: Math.random() * Math.PI * 2,
      as: 0.005 + Math.random() * 0.022,
      s: Math.floor(Math.random() * sprites.length),
      base: 0.22 + Math.random() * 0.6
    });
  }
}

function drawStars(){
  g2.clearRect(0, 0, W, H);
  g2.globalCompositeOperation = "lighter";
  for (let i = 0; i < parts.length; i++){
    const p = parts[i];
    p.x += p.vx;
    p.y += p.vy;
    p.a += p.as;
    if (p.y < -30) { p.y = H + 30; p.x = Math.random() * W; }
    if (p.x < -30) p.x = W + 30;
    if (p.x > W + 30) p.x = -30;

    const tw = 0.55 + 0.45 * Math.sin(p.a);
    const d  = p.r * 14 * (0.85 + 0.3 * tw);

    g2.globalAlpha = p.base * tw;
    g2.drawImage(sprites[p.s], p.x - d / 2, p.y - d / 2, d, d);
  }
  g2.globalAlpha = 1;
  g2.globalCompositeOperation = "source-over";
  requestAnimationFrame(drawStars);
}

sizeCanvas();
initParts();
drawStars();

let resizeT;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { sizeCanvas(); initParts(); }, 180);
});

/* =========================================================
   3. AUDIO  —  generated melody (or your own mp3)
   ========================================================= */
let musicStarted = false;

function startMusic(){
  if (musicStarted) return;
  musicStarted = true;
  if (SONG_URL) playSongFile();
  else startGenerativeMusic();
}

function playSongFile(){
  try{
    const a = new Audio(SONG_URL);
    a.loop = true;
    a.volume = 0;
    a.play().then(() => {
      let v = 0;
      const t = setInterval(() => {
        v = Math.min(0.9, v + 0.03);
        a.volume = v;
        if (v >= 0.9) clearInterval(t);
      }, 120);
    }).catch(() => startGenerativeMusic());
  }catch(e){ startGenerativeMusic(); }
}

function startGenerativeMusic(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  const actx = new AC();
  if (actx.state === "suspended") actx.resume();

  /* master */
  const master = actx.createGain();
  master.gain.setValueAtTime(0.0001, actx.currentTime);
  master.gain.exponentialRampToValueAtTime(0.55, actx.currentTime + 6);
  master.connect(actx.destination);

  /* soft space / echo */
  const delay = actx.createDelay(1.5);
  delay.delayTime.value = 0.42;
  const fb  = actx.createGain(); fb.gain.value = 0.36;
  const wet = actx.createGain(); wet.gain.value = 0.32;
  delay.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(master);

  const bus = actx.createGain();
  bus.gain.value = 1;
  bus.connect(master);
  bus.connect(delay);

  /* --- warm pad chords --- */
  const progression = [
    [130.81, 196.00, 246.94, 329.63], // Cmaj7
    [110.00, 164.81, 220.00, 329.63], // Am7
    [ 87.31, 174.61, 220.00, 349.23], // Fmaj7
    [ 98.00, 146.83, 196.00, 293.66]  // G
  ];
  const CHORD_DUR = 8;

  function playPad(freqs, start, dur){
    freqs.forEach((f, i) => {
      const osc = actx.createOscillator();
      osc.type = i % 2 ? "sine" : "triangle";
      osc.frequency.value = f;
      osc.detune.value = (Math.random() - 0.5) * 9;

      const gain = actx.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.055, start + dur * 0.4);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);

      const filt = actx.createBiquadFilter();
      filt.type = "lowpass";
      filt.frequency.value = 1500;

      osc.connect(gain); gain.connect(filt); filt.connect(bus);
      osc.start(start);
      osc.stop(start + dur + 0.2);
    });
  }

  /* --- gentle bell arpeggio --- */
  const penta = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  const bellFreqs = penta.map(s => 523.25 * Math.pow(2, s / 12));

  function playBell(freq, time, vol){
    const o1 = actx.createOscillator();
    o1.type = "sine"; o1.frequency.value = freq;

    const o2 = actx.createOscillator();
    o2.type = "sine"; o2.frequency.value = freq * 2.004;

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 2.4);

    const g2b = actx.createGain();
    g2b.gain.value = 0.22;

    o1.connect(g);
    o2.connect(g2b); g2b.connect(g);
    g.connect(bus);

    o1.start(time); o1.stop(time + 2.6);
    o2.start(time); o2.stop(time + 2.6);
  }

  /* --- scheduler --- */
  let chordIndex = 0;
  let nextChord = actx.currentTime + 0.15;
  let nextBell  = actx.currentTime + 1.2;

  setInterval(() => {
    const now = actx.currentTime;

    while (nextChord < now + 1.5){
      playPad(progression[chordIndex % progression.length], nextChord, CHORD_DUR + 2);
      nextChord += CHORD_DUR;
      chordIndex++;
    }

    while (nextBell < now + 0.25){
      if (Math.random() > 0.28){
        const f = bellFreqs[Math.floor(Math.random() * bellFreqs.length)];
        playBell(f, nextBell, 0.05 + Math.random() * 0.045);
      }
      nextBell += 0.34 + Math.random() * 0.55;
    }
  }, 100);
}

/* =========================================================
   4. FLOATING WORDS
   ========================================================= */
const wordLayer = document.getElementById("words");
let spawnTimer = null;
let liveWords = 0;

function spawnWord(){
  if (liveWords > 34) return;

  const el = document.createElement("div");
  el.className = "word";
  el.textContent = WORDS[Math.floor(Math.random() * WORDS.length)];

  const mobile = window.innerWidth < 640;
  const size = (1.25 + Math.random() * 2.9) * (mobile ? 0.72 : 1);
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  const dur = 10 + Math.random() * 7;
  const left = 2 + Math.random() * 86;

  el.style.left = left + "vw";
  el.style.fontSize = size + "rem";
  el.style.color = color;
  el.style.setProperty("--dx", (Math.random() * 240 - 120).toFixed(0) + "px");
  el.style.setProperty("--rot", (Math.random() * 16 - 8).toFixed(1) + "deg");
  el.style.setProperty("--op", (0.55 + Math.random() * 0.45).toFixed(2));
  el.style.animationDuration = dur.toFixed(2) + "s";

  wordLayer.appendChild(el);
  liveWords++;

  setTimeout(() => {
    el.remove();
    liveWords--;
  }, dur * 1000 + 400);
}

function beginWords(){
  spawnWord();
  setTimeout(spawnWord, 320);
  spawnTimer = setInterval(() => {
    spawnWord();
    if (Math.random() < 0.32) setTimeout(spawnWord, 240);
  }, 680);
}

/* =========================================================
   5. CONNECT
   ========================================================= */
const hero = document.getElementById("hero");
const btn  = document.getElementById("connect");

btn.addEventListener("click", () => {
  btn.disabled = true;

  /* ripple */
  const ripple = document.createElement("div");
  ripple.className = "ripple";
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 1900);

  /* visuals */
  document.body.classList.add("connected");
  hero.classList.add("hidden");

  /* music */
  startMusic();

  /* words */
  setTimeout(beginWords, 1000);

  /* keep the screen awake-ish & tidy */
  setTimeout(() => hero.remove(), 2200);
});
</script>
</body>
</html>
